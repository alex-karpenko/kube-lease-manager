[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# TODO: temporary exclusions, remove once upstream dependencies are updated.
ignore = [
    # astral-tokio-tar is unmaintained, no safe upgrade; pulled in by testcontainers (dev-dependency only).
    { id = "RUSTSEC-2026-0440", reason = "transitive dev-dependency via testcontainers, waiting for upstream replacement" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "ISC", "BSD-3-Clause", "CDLA-Permissive-2.0", "Apache-2.0 WITH LLVM-exception"]
confidence-threshold = 0.93
exceptions = [{ allow = ["Zlib"], name = "foldhash" }, { allow = ["Unicode-3.0"], name = "unicode-ident" }]

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []

skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1
